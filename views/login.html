<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TailAdmin Golang Auth</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 border border-slate-200">
    <!-- Brand / Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600 text-white rounded-lg font-bold text-xl mb-3 shadow">
        TA
      </div>
      <h2 class="text-2xl font-bold text-slate-900">Selamat Datang Kembali</h2>
      <p class="text-sm text-slate-500 mt-1">Masukkan kredensial Anda untuk masuk ke Dashboard</p>
    </div>

    <!-- Error / Success Alert -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <!-- Form Login -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Email</label>
        <input type="email" id="email" required placeholder="nama@email.com"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
      </div>

      <button type="submit" id="btnSubmit"
        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm">
        Masuk (Login)
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 text-center text-sm text-slate-500">
      Belum punya akun?
      <a href="/register" class="text-indigo-600 hover:underline font-semibold">Daftar sekarang</a>
    </div>
  </div>

  <script>
    // Jika user sudah punya token, langsung lempar ke dashboard
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const btnSubmit = document.getElementById('btnSubmit');
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Memverifikasi...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (response.ok && result.data && result.data.token) {
          // Simpan token JWT di localStorage
          localStorage.setItem('token', result.data.token);

          alertBox.className = "mb-4 p-3 rounded-lg text-sm bg-emerald-100 text-emerald-800 border border-emerald-300";
          alertBox.innerText = "Login berhasil! Mengalihkan ke Dashboard...";
          alertBox.classList.remove('hidden');

          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1000);
        } else {
          alertBox.className = "mb-4 p-3 rounded-lg text-sm bg-rose-100 text-rose-800 border border-rose-300";
          alertBox.innerText = result.message || "Email atau password salah.";
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        alertBox.className = "mb-4 p-3 rounded-lg text-sm bg-rose-100 text-rose-800 border border-rose-300";
        alertBox.innerText = "Terjadi kesalahan koneksi ke server.";
        alertBox.classList.remove('hidden');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Masuk (Login)';
      }
    }
  </script>
</body>
</html>
